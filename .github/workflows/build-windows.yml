name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller qrcode pillow
      - name: Build
        run: pyinstaller qrbatch.spec
      - name: Package
        run: Compress-Archive -Path dist/QRBatch -DestinationPath QRBatch-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QRBatch-Windows
          path: QRBatch-Windows.zip
